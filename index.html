<link rel="preload" as="image" href="assets/img/hero-desktop-1920.webp" imagesrcset="assets/img/hero-desktop-1280.webp 1280w, assets/img/hero-desktop-1920.webp 1920w" imagesizes="100vw" media="(min-aspect-ratio: 1/1)">

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Nastaliq+Urdu:wght@600&family=Open+Sans:wght@400;600;700&display=swap"></noscript>
<style>
:root{
  --green:#0a483b; --sage:#d4d6b3; --sage-soft:#f3f4ec; --gold:#a2941e; --gold-text:#6f6512; --green-dark:#073a30;
  --white:#fff; --text:#1d2622; --muted:#5d6762; --line:rgba(10,72,59,.12);
  --nav-h:84px; --bar-h:0px;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 8px)}
html,body{margin:0;background:var(--white)}
body{color:var(--text);font-family:'Tajawal',system-ui,sans-serif;line-height:1.75;font-size:17px;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:'Open Sans',system-ui,sans-serif;font-size:16px}
h1,h2,h3{margin:0;color:var(--green);line-height:1.3;font-weight:800}
p{margin:0}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
section{padding:72px 0}
@media(min-width:900px){section{padding:104px 0}.wrap{padding:0 32px}}
.kicker{display:block;color:var(--gold-text);font-weight:800;font-size:.9rem;margin-bottom:10px;letter-spacing:.2px}
.h2{font-size:clamp(1.75rem,4.6vw,2.6rem)}
.lead{color:var(--muted);font-size:1.05rem;margin-top:14px;max-width:56ch}
.brand-script{font-family:'Noto Nastaliq Urdu',serif;font-weight:600;line-height:2.1}
html[lang="en"] .brand-script{font-family:'Open Sans',sans-serif;font-style:italic;line-height:1.6}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:999px;font-weight:800;font-size:1rem;border:1.5px solid transparent;background:none;transition:background .2s,transform .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-dark)}
.btn-sage{background:var(--sage);color:var(--green)}
.btn-sage:hover{background:#c6c9a0}
.btn-ghost-light{border-color:rgba(255,255,255,.75);color:#fff}
.btn-ghost{border-color:var(--green);color:var(--green)}
.btn-green{background:var(--green);color:#fff}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.reveal{opacity:0;transform:translateY(16px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}

/* ---------- flag + nav ---------- */
.nav .logo .on-dark{display:none}
body.in-hero .nav{background:transparent;border-color:transparent;backdrop-filter:none;-webkit-backdrop-filter:none}
body.in-hero .nav .logo .on-light{display:none}
body.in-hero .nav .logo .on-dark{display:block}
body.in-hero .nav .nav-links a{color:#fff}
body.in-hero .nav .icon-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
body.in-hero .nav .flag{opacity:0}
.nav .flag{transition:opacity .35s}
body.in-hero .nav::before{content:"";position:absolute;inset:0 0 -40px;background:linear-gradient(180deg,rgba(10,8,6,.55),transparent);pointer-events:none;z-index:-1}
.flag{height:4px;display:flex}
.flag i{flex:1}.flag .k{background:#161412}.flag .w{background:#fff}.flag .g{background:#0a483b}.flag .r{flex:0 0 44px;background:#c8202f}
.nav{position:fixed;top:0;inset-inline:0;z-index:50;transition:background .35s,border-color .35s;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{height:var(--nav-h);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.nav-start{display:flex;align-items:center;justify-self:start}
.nav .logo{justify-self:center;display:block}
.nav .logo img{height:68px;width:auto}
.nav-tools{justify-self:end}
.nav-links{display:none;gap:26px;font-weight:700;font-size:.95rem}
.nav-links a:hover{color:var(--green)}
.nav-tools{display:flex;align-items:center;gap:8px}
.icon-btn{min-width:44px;height:44px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:.8rem;display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
.nav-order{display:none;position:relative}
.cart-badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--sage);color:var(--green);font-size:.7rem;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 5px}
.mobile-menu{display:none;border-top:1px solid var(--line);background:#fff}
.mobile-menu.open{display:block}
.mobile-menu a{display:flex;align-items:center;min-height:52px;padding:0 20px;font-weight:700;border-bottom:1px solid var(--line)}
@media(min-width:900px){
  :root{--nav-h:112px}
  .nav .logo img{height:96px}
  .nav-order{display:inline-flex}
}
@media(min-width:1140px){.nav-links{display:flex}.menu-toggle{display:none}}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- hero: responsive image (portrait on phones, landscape on wide screens) ---------- */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{position:relative;height:100vh;height:100svh;min-height:560px;overflow:hidden;background:#3a200c;color:#fff;padding:0}
.hero picture,.hero-img{position:absolute;inset:0;width:100%;height:100%}
.hero-img{object-fit:cover;object-position:50% 50%;animation:heroZoom 9s ease-out both}
.hero-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s ease}
.hero-video.on{opacity:1}
@keyframes heroZoom{from{transform:scale(1.07)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,10,4,.45) 0%,rgba(20,10,4,0) 22%,rgba(20,10,4,0) 38%,rgba(20,10,4,.55) 66%,rgba(20,10,4,.86) 100%)}
.hero-inner{position:absolute;inset-inline:0;bottom:0;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;padding:0 20px calc(46px + env(safe-area-inset-bottom,0px))}
.hero .eyebrow{font-family:'Noto Nastaliq Urdu',serif;font-weight:600;line-height:2.1;font-size:clamp(1.15rem,3.6vw,1.5rem);color:var(--sage);animation:rise .6s ease both}
html[lang="en"] .hero .eyebrow{font-family:'Open Sans',sans-serif;font-style:italic;line-height:1.6}
.hero h1{color:#fff;font-size:clamp(2.3rem,8vw,4.4rem);line-height:1.2;max-width:14ch;text-shadow:0 2px 30px rgba(0,0,0,.35);animation:rise .6s .06s ease both}
.hero .sub{margin-top:14px;font-size:clamp(1rem,2.6vw,1.15rem);color:rgba(255,255,255,.9);max-width:46ch;animation:rise .6s .12s ease both}
.hero-ctas{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;animation:rise .6s .18s ease both}
.hero .trust{margin-top:18px;font-size:.85rem;color:rgba(255,255,255,.8);animation:rise .6s .24s ease both}
@media(min-width:900px){.hero-inner{padding-bottom:64px}}

/* ---------- layered sections: each one slides over the previous ---------- */
main{position:relative}
.sheet{position:relative;z-index:1;background:#fff;border-radius:28px 28px 0 0;margin-top:-28px;box-shadow:0 -14px 34px rgba(4,31,25,.12)}
footer.sheet{box-shadow:0 -14px 34px rgba(4,31,25,.18)}
@media(min-width:900px){.sheet{border-radius:40px 40px 0 0;margin-top:-40px}}

/* ---------- showcase ---------- */
.showcase{padding:52px 0 64px;background:#fff}
.track{--w:84vw;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px calc(50% - var(--w)/2);scrollbar-width:none;overscroll-behavior-x:contain;cursor:grab;touch-action:pan-x pan-y}
.track::-webkit-scrollbar{display:none}
.track.dragging{scroll-snap-type:none;cursor:grabbing}
.shot{flex:0 0 var(--w);aspect-ratio:3/2;border-radius:14px;overflow:hidden;scroll-snap-align:center;transform-origin:center;transition:transform .35s ease,opacity .35s ease;background:var(--sage-soft)}
.shot img{width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;pointer-events:none}
@media(min-width:700px){.track{--w:62vw}}
@media(min-width:1024px){.track{--w:500px;gap:22px}}

.show-wrap{position:relative}
.arr{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.94);color:var(--green);box-shadow:0 4px 16px rgba(0,0,0,.16);display:flex;align-items:center;justify-content:center;transition:opacity .25s}
.arr svg{width:22px;height:22px}
.arr.prev{inset-inline-start:10px}.arr.next{inset-inline-end:10px}
html[dir="rtl"] .arr svg{transform:scaleX(-1)}
.arr[disabled]{opacity:0;pointer-events:none}
@media(min-width:1024px){.arr.prev{inset-inline-start:calc(50% - 250px - 70px)}.arr.next{inset-inline-end:calc(50% - 250px - 70px)}}
.show-foot{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}
.dots{display:flex;gap:8px}
.dots button{width:30px;height:30px;border:0;background:none;padding:0;display:flex;align-items:center;justify-content:center}
.dots button::before{content:"";width:8px;height:8px;border-radius:4px;background:var(--sage);transition:width .25s,background .25s}
.dots button.on::before{width:22px;background:var(--green)}
.swipe-hint{display:inline-flex;align-items:center;gap:8px;font-size:.88rem;font-weight:700;color:var(--muted);transition:opacity .4s}
.swipe-hint svg{width:22px;height:22px;color:var(--green);animation:nudge 1.6s ease-in-out infinite}
html[dir="rtl"] .swipe-hint svg{transform:scaleX(-1);animation-name:nudgeR}
.swipe-hint.gone{opacity:0}
@keyframes nudge{0%,100%{translate:0}50%{translate:7px}}
@keyframes nudgeR{0%,100%{translate:0}50%{translate:-7px}}

/* ---------- story ---------- */
.story{background:var(--sage-soft)}
.taste{background:var(--sage-soft)}
.story-text{max-width:760px;margin:0 auto;text-align:center}
.story-text p{color:var(--muted);margin:16px auto 0;max-width:60ch}
.story-text p.first{color:var(--text);font-size:1.15rem;font-weight:700;margin-top:18px}
.story-close{margin-top:22px;font-size:1.35rem;color:var(--green)}

/* ---------- menu ---------- */
.menu{background:#fff}
.menu-head{max-width:640px}
.cat-bar{position:sticky;top:var(--nav-h);z-index:10;background:#fff;margin:26px -20px 0;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.cat-bar::-webkit-scrollbar{display:none}
.cat-chip{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center}
.cat-chip.active{background:var(--green);border-color:var(--green);color:#fff}
.cat-block{margin-top:34px;scroll-margin-top:calc(var(--nav-h) + 72px)}
.cat-block h3{font-size:1.3rem;margin-bottom:6px}
.items{background:#fff;border-radius:14px;border:1px solid var(--line);box-shadow:0 2px 10px rgba(10,72,59,.04)}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);min-height:72px}
.item:last-child{border-bottom:0}
.item .info{flex:1;min-width:0}
.item .name{font-weight:800;font-size:1.02rem;line-height:1.45}
.item .meta{font-size:.86rem;color:var(--muted);margin-top:2px}
.item .price{font-weight:800;color:var(--green)}
.add{min-width:88px;min-height:44px;border-radius:999px;border:1.5px solid var(--green);background:#fff;color:var(--green);font-weight:800;font-size:.9rem;padding:0 14px}
.stepper{display:flex;align-items:center;gap:4px;background:var(--green);border-radius:999px;padding:2px}
.stepper button{width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:#fff;font-size:1.25rem;font-weight:800;line-height:1}
.stepper .q{min-width:52px;text-align:center;color:#fff;font-weight:800;font-size:.9rem}
@media(min-width:900px){.cat-bar{margin:30px 0 0;padding:10px 0}.menu-cols{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}}

/* ---------- taste ---------- */
.taste-grid{margin-top:30px;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.taste-item{background:#fff;padding:20px 18px}
.taste-item h3{font-size:1.05rem}
.taste-item p{color:var(--muted);font-size:.92rem;margin-top:6px;line-height:1.65}
@media(min-width:900px){.taste-grid{grid-template-columns:repeat(3,1fr)}.taste-item{padding:28px 26px}}

/* ---------- why ---------- */
.why{background:var(--green);color:#fff}
.why .h2{color:#fff}
.why .kicker{color:var(--sage)}
.why-grid{margin-top:34px;display:grid;gap:26px}
.why-item{display:flex;gap:16px;align-items:flex-start}
.why-item .n{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--sage);color:var(--sage);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.9rem}
.why-item h3{color:#fff;font-size:1.1rem}
.why-item p{color:rgba(255,255,255,.78);font-size:.95rem;margin-top:4px}
@media(min-width:900px){.why-grid{grid-template-columns:repeat(4,1fr);gap:32px}.why-item{flex-direction:column}}

/* ---------- video break ---------- */

/* ---------- how + delivery ---------- */
.how{background:#fff}
.reviews{background:#fff}
.steps{margin-top:32px;display:grid;gap:14px}
.step{display:flex;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:14px}
.step .num{flex:none;font-weight:800;font-size:1.5rem;color:var(--gold-text);width:48px}
.step h3{font-size:1.08rem}
.step p{color:var(--muted);font-size:.93rem}
@media(min-width:900px){.steps{grid-template-columns:repeat(3,1fr)}.step{flex-direction:column;align-items:flex-start}}
.delivery{margin-top:28px;background:var(--sage-soft);border-radius:14px;padding:22px}
.delivery h3{font-size:1.1rem}
.delivery p{color:var(--muted);font-size:.95rem;margin-top:6px}

/* ---------- reviews ---------- */
.reviews-track{margin-top:26px;display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.review{flex:0 0 min(84vw,380px);scroll-snap-align:start;border:1px solid var(--line);border-radius:14px;padding:22px}
.review p{font-size:1rem}
.review .who{margin-top:12px;font-weight:800;color:var(--green);font-size:.9rem}

/* ---------- faq ---------- */
.faq{background:var(--sage-soft)}
.faq-list{margin-top:26px;max-width:760px}
.faq details{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.faq summary{list-style:none;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;font-weight:800;cursor:pointer}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.4rem;color:var(--green);flex:none}
.faq details[open] summary::after{content:"−"}
.faq details p{padding:0 18px 16px;color:var(--muted)}

/* ---------- final ---------- */
.final{text-align:center;background:#fff}
.final .lead{margin-inline:auto}
.final-ctas{margin-top:24px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* ---------- footer ---------- */
footer,footer.sheet{background:radial-gradient(120% 90% at 80% 0%,#13614f 0%,#0a483b 52%,#073a30 100%);color:rgba(255,255,255,.84);padding:56px 0 calc(28px + var(--bar-h));overflow:hidden;text-align:center}
footer .mark{position:absolute;width:min(70vw,460px);inset-inline-end:-14%;bottom:-18%;opacity:.045;pointer-events:none}
footer .mark.top{inset-inline-end:auto;inset-inline-start:-10%;bottom:auto;top:-10%;width:min(45vw,300px);transform:rotate(45deg);opacity:.035}
footer .wrap{position:relative;z-index:1}
.foot-brand img{height:120px;width:auto;margin:0 auto}
.foot-brand p{margin-top:14px;color:var(--sage)}
.foot{display:grid;gap:26px;margin-top:34px;padding-top:30px;border-top:1px solid rgba(212,214,179,.2)}
.foot h4{margin:0 0 10px;color:var(--sage);font-size:.85rem}
.foot a,.foot p{display:block;font-size:.93rem;margin-bottom:8px}
.copy{margin-top:30px;padding-top:18px;border-top:1px solid rgba(212,214,179,.2);font-size:.8rem;color:rgba(255,255,255,.72)}
@media(min-width:900px){.foot{grid-template-columns:1fr 1fr;max-width:760px;margin-inline:auto}.foot-brand img{height:140px}}

/* ---------- mobile bottom CTA ---------- */
.order-bar{position:fixed;inset-inline:0;bottom:0;z-index:60;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,255,255,.97);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .3s ease}
.order-bar.show{transform:none}
.order-bar .btn{width:100%;min-height:52px;position:relative}
.order-bar .cart-badge{position:static;margin-inline-start:6px;background:#fff;color:var(--green)}
@media(min-width:900px){.order-bar{display:none}}

/* ---------- order page ---------- */
.order-page{display:none;position:fixed;inset:0;z-index:100;background:var(--sage-soft);overflow-y:auto;-webkit-overflow-scrolling:touch}
.order-page.open{display:block}
.op-nav{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.op-nav .wrap{height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.op-nav img{height:60px;justify-self:center}
.op-nav .back{justify-self:start}
.back{min-height:44px;display:inline-flex;align-items:center;gap:6px;background:none;border:0;font-weight:800;color:var(--green)}
.back svg{width:20px;height:20px}
html[dir="ltr"] .back svg{transform:scaleX(-1)}
.op-body{max-width:880px;margin:0 auto;padding:28px 20px calc(40px + env(safe-area-inset-bottom,0px))}
.op-body h1{font-size:clamp(1.6rem,4vw,2.2rem)}
.op-grid{margin-top:22px;display:grid;gap:18px}
.panel{background:#fff;border-radius:16px;border:1px solid var(--line);padding:20px}
.panel h2{font-size:1.05rem;color:var(--gold-text);margin-bottom:6px}
.line{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line:last-of-type{border-bottom:0}
.line .info{flex:1;min-width:0}
.line .name{font-weight:800;font-size:.97rem}
.line .meta{font-size:.84rem;color:var(--muted)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:14px;border-top:1.5px dashed var(--line);font-weight:800}
.total .amt{font-size:1.25rem;color:var(--green)}
.note{font-size:.8rem;color:var(--muted);margin-top:6px}
.field{margin-top:14px}

/* ---------- showcase carousel ---------- */
(function(){
  const track = document.getElementById('track'), shots = [...track.children];
  let ticking = false;
  function scaleShots(){
    ticking = false;
    const r = track.getBoundingClientRect(), mid = r.left + r.width/2;
    shots.forEach(s => {
      const b = s.getBoundingClientRect();
      const d = Math.min(Math.abs(b.left + b.width/2 - mid) / b.width, 1);
      s.style.transform = `scale(${1 - d*0.14})`;
      s.style.opacity = String(1 - d*0.3);
    });
  }
  const dots = document.getElementById('dots'), prev = document.getElementById('arrPrev'), next = document.getElementById('arrNext'), hint = document.getElementById('swipeHint');
  dots.innerHTML = shots.map((_,n) => `<button aria-label="${n+1}"></button>`).join('');
  const dotBtns = [...dots.children];
  function current(){
    const r = track.getBoundingClientRect(), mid = r.left + r.width/2; let bi = 0, bd = 1e9;
    shots.forEach((s,n) => { const b = s.getBoundingClientRect(), d = Math.abs(b.left + b.width/2 - mid); if(d < bd){ bd = d; bi = n; } });
    return bi;
  }
  function goTo(n){
    n = Math.max(0, Math.min(shots.length-1, n));
    const r = track.getBoundingClientRect(), b = shots[n].getBoundingClientRect();
    track.scrollBy({ left: (b.left + b.width/2) - (r.left + r.width/2), behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  function syncUI(){
    const c = current();
    dotBtns.forEach((d,n) => d.classList.toggle('on', n === c));
    prev.disabled = c === 0; next.disabled = c === shots.length-1;
  }
  prev.onclick = () => goTo(current() - 1);
  next.onclick = () => goTo(current() + 1);
  dotBtns.forEach((d,n) => d.onclick = () => goTo(n));
  let moved = false;
  track.addEventListener('scroll', () => {
    if(!ticking){ ticking = true; requestAnimationFrame(() => { scaleShots(); syncUI(); }); }
    if(!moved && current() > 0){ moved = true; hint.classList.add('gone'); }
  }, { passive:true });
  addEventListener('resize', scaleShots);
  function snapNearest(){
    const r = track.getBoundingClientRect(), mid = r.left + r.width/2;
    let best = null, bd = 1e9;
    shots.forEach(s => { const b = s.getBoundingClientRect(), d = b.left + b.width/2 - mid; if(Math.abs(d) < Math.abs(bd)){ bd = d; best = s; } });
    track.scrollBy({ left: bd, behavior: reduceMotion ? 'auto' : 'smooth' });
  }
  let down = false, sx = 0, sl = 0;
  track.addEventListener('pointerdown', e => { if(e.pointerType !== 'mouse') return; down = true; sx = e.clientX; sl = track.scrollLeft; track.classList.add('dragging'); });
  addEventListener('pointermove', e => { if(down) track.scrollLeft = sl - (e.clientX - sx); });
  addEventListener('pointerup', () => { if(!down) return; down = false; track.classList.remove('dragging'); snapNearest(); });
  track.addEventListener('keydown', e => {
    if(e.key === 'ArrowLeft' || e.key === 'ArrowRight'){ track.scrollBy({ left: (e.key === 'ArrowRight' ? 1 : -1) * shots[0].offsetWidth, behavior:'smooth' }); }
  });
  track.tabIndex = 0;
  requestAnimationFrame(() => { scaleShots(); syncUI(); });
})();

/* ---------- hero video: portrait file on portrait screens, landscape file on wide screens ----------
   The image stays underneath as the instant first paint and as the fallback. */
const HERO_VIDEOS = { mobile:"assets/video/hero-mobile.mp4", desktop:"assets/video/hero-desktop.mp4" };
(function(){
  const hero = document.getElementById('hero'), v = document.getElementById('heroVideo');
  const saveData = navigator.connection && navigator.connection.saveData;
  if(reduceMotion || saveData){ v.remove(); return; }
  v.muted = true; v.defaultMuted = true;
  const mq = matchMedia('(max-aspect-ratio: 1/1)'), cache = {};
  function toPlayable(src){
    if(!src.startsWith('data:')) return src;
    if(cache[src]) return cache[src];
    try{
      const bin = atob(src.slice(src.indexOf(',') + 1)), bytes = new Uint8Array(bin.length);
      for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return cache[src] = URL.createObjectURL(new Blob([bytes], { type:'video/mp4' }));
    }catch(e){ return src; }
  }
  let current = '', visible = true;
  function play(){ const p = v.play(); if(p && p.catch) p.catch(() => {}); }
  function pick(){
    const want = mq.matches ? HERO_VIDEOS.mobile : HERO_VIDEOS.desktop;
    if(!want || want === current) return;
    current = want; v.classList.remove('on');
    v.src = toPlayable(want); v.load(); if(visible) play();
  }
  v.addEventListener('playing', () => v.classList.add('on'));
  v.addEventListener('error', () => v.classList.remove('on'));
  if(mq.addEventListener) mq.addEventListener('change', pick); else if(mq.addListener) mq.addListener(pick);
  new IntersectionObserver(es => { visible = es[0].isIntersecting; visible ? play() : v.pause(); }).observe(hero);
  // iOS Low Power Mode can refuse autoplay; retry on the first touch
  addEventListener('touchstart', () => { if(v.paused && visible) play(); }, { passive:true, once:true });
  pick();
})();

async function sendOrder(){
  keepForm();
  const err = document.getElementById('opErr'), btn = document.getElementById('sendBtn');
  if(!form.name?.trim() || !form.phone?.trim()){ err.innerHTML = `<div class="err">${tr('e_req')}</div>`; return; }
  if(method === 'delivery' && !form.address?.trim()){ err.innerHTML = `<div class="err">${tr('e_addr')}</div>`; return; }
  const items = ALL.filter(it => cart[it.id]).map(it => ({ id:it.id, name:it.name[0], qty:cart[it.id], unit:UNITS[it.unit][0], price:it.price, subtotal:it.price*cart[it.id] }));
  const order = { name:form.name.trim(), phone:form.phone.trim(), method, address: method==='delivery' ? (form.address||'').trim() : '',
    date:form.date||'', time:form.time||'', notes:(form.notes||'').trim(), items,
    total: items.reduce((s,x) => s + x.subtotal, 0), lang, status:"جديد", createdAt:new Date().toISOString() };
  btn.disabled = true; btn.textContent = tr('sending');
  try{
    const id = await saveOrder(order);
    Object.keys(cart).forEach(k => delete cart[k]); Object.keys(form).forEach(k => delete form[k]);
    updateBadges(); renderMenu();
    document.getElementById('opContent').innerHTML = `<div class="panel done" style="margin-top:22px">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/></svg>

      <div><button class="btn btn-ghost" style="margin-top:20px" id="doneBack">${tr('back')}</button></div></div>`;
    document.getElementById('doneBack').onclick = () => closeOrder(false);
  }catch(e){
    const wa = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(orderText(order));
    err.innerHTML = `<div class="err">${tr('e_send')}</div><a class="btn btn-ghost" style="width:100%;margin-top:10px" target="_blank" rel="noopener" href="${wa}">${tr('e_wa')}</a>`;
    btn.disabled = false; btn.textContent = tr('submit');
  }
}

function orderText(o){
  const lines = o.items.map(x => `- ${x.name}: ${x.qty} (${x.unit})`).join("\n");
  return `طلب جديد — خبزة وزعتر\nالاسم: ${o.name}\nالهاتف: ${o.phone}\nالاستلام: ${o.method === 'delivery' ? 'توصيل — ' + o.address : 'استلام'}\nالموعد: ${o.date} ${o.time}\n${lines}\nالإجمالي التقريبي: ${Math.round(o.total)} ج.م${o.notes ? "\nملاحظات: " + o.notes : ""}`;
}

async function saveOrder(order){
  const id = "KZ" + Date.now().toString().slice(-6);
  if(ORDER_BACKEND === "claude"){
    const db = await claude.use('db');
    if(!db) throw new Error('db');
    await db.collection('orders').doc(id).set({ ...order, id });
    return id;
  }
  if(!SHEETS_URL) throw new Error('no-endpoint');
  const payload = { ...order, id,
    itemsText: order.items.map(x => `${x.name} × ${x.qty} (${x.unit})`).join(" | "),
    methodText: order.method === 'delivery' ? 'توصيل' : 'استلام' };
  await fetch(SHEETS_URL, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
  return id;
}
